name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Superseded PR runs are cancelled; pushes to main run to completion so an
  # in-flight production deploy is never killed mid-release.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Dummy value: only needed for `prisma generate` to resolve the env
      # var reference in prisma.config.ts. No database connection is made
      # during install, lint, typecheck, or build.
      DATABASE_URL: "postgresql://user:password@localhost:5432/pdpsi?schema=public"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

  # Continuous deployment: pushes to main that pass every check above trigger a
  # DigitalOcean App Platform deployment (which applies pending Prisma
  # migrations on boot via the `start` script). Requires two repo settings:
  #   - secret DIGITALOCEAN_ACCESS_TOKEN: a DO API token with app deploy scope
  #   - variable DIGITALOCEAN_APP_NAME: the App Platform app's name
  # Turn OFF "Autodeploy" on the DO app so this job is the only deploy path —
  # otherwise DO deploys immediately on push, bypassing CI.
  deploy:
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - name: Deploy to DigitalOcean App Platform
        uses: digitalocean/app_action/deploy@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
          app_name: ${{ vars.DIGITALOCEAN_APP_NAME }}
